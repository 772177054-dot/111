name: circBank strict harvest
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Run harvest and preserve partial results
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p results
          python harvest.py > results/run.log 2>&1 || echo "python_exit_code=$?" > results/exit_status.txt
          test -f results/exit_status.txt || echo "python_exit_code=0" > results/exit_status.txt
          tail -n 300 results/run.log || true
      - name: Upload harvest results
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: circbank-harvest-results
          path: results/
          if-no-files-found: warn
          retention-days: 7
