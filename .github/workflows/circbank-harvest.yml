name: circBank strict harvest
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-circbank-full-harvest-20260727
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Decode robust harvester
        shell: bash
        run: |
          base64 -d harvest_v2.py.gz.b64 | gzip -dc > harvest_v2.py
          python -m py_compile harvest_v2.py
      - name: Run harvest and preserve results
        shell: bash
        run: |
          mkdir -p results
          set +e
          python harvest_v2.py > results/run.log 2>&1
          code=$?
          echo "python_exit_code=$code" > results/exit_status.txt
          tail -n 300 results/run.log || true
          exit 0
      - name: Commit results to branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/
          git commit -m "Add circBank harvest results" || true
          git push origin HEAD:tmp-circbank-full-harvest-20260727
      - name: Upload harvest results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: circbank-harvest-results
          path: results/
          if-no-files-found: warn
          retention-days: 7
